name: Tourism Package Prediction MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  data-registration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python src/validate_data.py

  data-preparation:
    runs-on: ubuntu-latest
    needs: data-registration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python src/prepare_data.py

      - uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: artifacts/

  model-building:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dataset
          path: artifacts/

      - run: python src/train_model.py

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            best_model.pkl
            feature_columns.pkl
            label_encoders.pkl
